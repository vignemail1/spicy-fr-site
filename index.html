<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spicy — Streameuse Multigaming</title>
  <meta name="description" content="Spicy, passionnée de jeux vidéo, explore de nouveaux mondes, vit et partage de grandes histoires avec sa communauté." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <main>
    <!-- Hero -->
    <section class="ornament-frame hero">
      <span class="sparkle s1">✦</span>
      <span class="sparkle s2">✦</span>
      <span class="sparkle s3">✦</span>
      <span class="sparkle s4">✦</span>
      <span id="hero-badge" class="badge"></span>
      <h1 id="hero-title"></h1>
      <p id="hero-subtitle" class="subtitle"></p>
      <p id="hero-text" class="hero-text"></p>
      <div class="cta-row">
        <a id="hero-cta-primary" class="btn btn-primary" href="#"></a>
        <a id="hero-cta-secondary" class="btn btn-secondary" href="#"></a>
      </div>
    </section>

    <!-- À propos -->
    <section class="ornament-frame about">
      <span class="sparkle s1">✦</span>
      <span class="sparkle s2">✦</span>
      <h2 id="about-title"></h2>
      <p id="about-text" class="about-text"></p>
      <ul id="about-facts" class="facts"></ul>
    </section>

    <!-- Jeux -->
    <section>
      <h2 id="games-title"></h2>
      <div id="games-list" class="cards-grid"></div>
    </section>

    <!-- Réseaux -->
    <section>
      <h2 id="socials-title"></h2>
      <div id="socials-list" class="links-row"></div>
    </section>

    <!-- Soutien -->
    <section class="ornament-frame support">
      <span class="sparkle s1">✦</span>
      <span class="sparkle s2">✦</span>
      <h2 id="support-title"></h2>
      <p id="support-text" class="support-text"></p>
      <div id="support-list" class="support-links"></div>
    </section>
  </main>

  <footer>
    <p><span id="footer-text"></span> · <a id="footer-contact" href="#">Contact</a> · <a href="https://spicy-fr.com">spicy-fr.com</a></p>
  </footer>

  <script src="assets/data.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
